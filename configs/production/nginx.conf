# =============================================================================
# KidCAD-Pro-IA — Reverse proxy nginx (production)
# Rôle :
#   /           → app:3000      (Next.js : frontend + API REST /api/*)
#   /socket.io/ → ai-engine:3010 (mini-service IA, upgrade WebSocket)
# gzip activé pour JSON/JS/CSS/SVG (les designs JSON peuvent être volumineux).
# =============================================================================

upstream kidcad_app {
    server app:3000;
    keepalive 32;
}

upstream kidcad_ai_engine {
    server ai-engine:3010;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # Tailles adaptées aux uploads de netlists et aux designs JSON
    client_max_body_size 20m;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/zip
        image/svg+xml;

    # --- Cache des assets statiques Next.js ----------------------------------
    location /_next/static/ {
        proxy_pass http://kidcad_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Service IA : socket.io (WebSocket, port 3010) ------------------------
    # Le client se connecte avec io("/?XTransformPort=3010", { path: "/" }) ;
    # nginx route ici tout préfixe /socket.io/ vers le service Bun.
    location /socket.io/ {
        proxy_pass http://kidcad_ai_engine;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # --- Application : frontend + API REST ------------------------------------
    location / {
        proxy_pass http://kidcad_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
