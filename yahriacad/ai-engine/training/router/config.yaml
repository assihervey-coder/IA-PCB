# ==============================================================
# YahriaCad - configuration du routeur IA (entrainement + inference)
#
# Ce fichier est lu au demarrage par cmd/ai-server/main.py et src/service.py
# (sections router/env/placer/optimizer). La section `ppo` sert de reference
# au script d'entrainement (torch optionnel, generate par
# scripts/generate-models.sh).
# ==============================================================

router:
  # "auto" = cuda si disponible sinon cpu ; le service fonctionne SANS torch
  # (repli A* deterministe) tant qu'aucun checkpoint n'est present.
  device: auto
  # Chemin du checkpoint PPO (relatif a la racine ai-engine/).
  # Genere par l'entrainement, JAMAIS committe a la main.
  # model_bc_v6.pt = imitation learning (BC pondere + 2 rondes DAgger sur
  # vraie carte) ; strategie production = jambe RL + chainage A* des pads
  # restants (rl_leg_completion). Absent => repli A* integral.
  model_path: training/router/model_bc_v6.pt
  # Registre multi-checkpoints : chaque entree est chargee au demarrage,
  # cle = canaux d'observation detectes dans le state_dict (= couches + 4).
  # A la requete, le modele adapte a la carte sert le RL ; les formats sans
  # checkpoint dedie routent en A* (repli deterministe).
  model_paths:
    - training/router/model_bc_v6.pt   # 2 couches cuivre (6 canaux)
    - training/router/model_bc_4l.pt   # 4 couches cuivre (8 canaux)
  # Completer les nets multi-pads par A* apres la premiere jambe RL.
  rl_leg_completion: true
  # Canaux d'observation : layer_count (2) + source + cible + indicateur
  # couche + position de l'agent (canal ajoute : sans lui la politique
  # n'est pas reactive). Les checkpoints 5 canaux precedents sont
  # incompatibles et doivent etre re-entraines.
  in_channels: 6

env:
  # Resolution de la grille de routage (mm). 0.25 mm = la valeur du contrat.
  grid_resolution_mm: 0.25
  # Halo (en cellules) bloque autour des pads etrangers et du bord de carte.
  clearance_cells: 1
  # Limite de pas par episode (null = auto : max(64, 4*(W+H)*couches)).
  max_steps: null

reward:
  # Penalite d'un via (unites de cout A* / recompense).
  via_penalty: 15.0
  # Penalite par pas (favorise les pistes courtes).
  step_penalty: 0.02
  # Coefficient de modelage par progression vers la cible (potentiel).
  progress_coef: 8.0
  # Bonus de reussite (pad cible atteint).
  success_bonus: 100.0
  # Penalite de collision (mouvement invalide, position conservee).
  collision_penalty: 2.0

ppo:
  lr: 0.0003          # 3e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  epochs: 4
  batch_size: 64
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  rollout_len: 256
  seed: 0
  total_steps: 1000000

a3c:
  lr: 0.0001
  gamma: 0.99
  n_steps: 20
  n_workers: 4
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

placer:
  # Recuit simule (PlanPlacement) - deterministe via la graine.
  iterations: 1500
  time_budget_ms: 2000
  # null = graine derivee du nombre de composants de la requete (deterministe).
  seed: null
  overlap_weight: 5.0

optimizer:
  # Rip-up & reroute (OptimizeRoutes) : couts du score composite.
  via_cost_mm: 2.0     # equivalent mm d'un via
  drc_cost: 10.0       # penalite par violation DRC estimee
  clearance_mm: 0.2
