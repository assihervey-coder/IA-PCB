# ==============================================================
# YahriaCad — configuration nginx de production (proxy de bord)
#
# Rôle : point d'entrée unique derrière un éventuel TLS ( termination
# par l'hébergeur ou un conteneur nginx dédié) :
#   /api/  -> backend Go  (backend:8080)
#   /ws/   -> backend Go  (WebSocket upgrade, timeouts longs)
#   /      -> frontend Next.js (frontend:3000)
#
# Remarque : l'API gRPC du moteur IA (ai-engine:50051) n'est PAS exposée
# par nginx — seul le backend Go la consomme sur le réseau interne Docker.
#
# Usage (conteneur optionnel) :
#   docker run -v configs/production/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
#              --network yahriacad_yahriacad -p 80:80 nginx:1.27-alpine
# ==============================================================

upstream yahriacad_backend {
    server backend:8080;
}

upstream yahriacad_frontend {
    server frontend:3000;
}

# (information) upstream yahriacad_ai { server ai-engine:50051; } — gRPC,
# consommé uniquement par le backend, non routé par nginx.

server {
    listen 80;
    server_name _;

    # Compression texte (JSON API, HTML, assets Next.js).
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Les assets immuables de Next.js (/_next/static) sont versionnés :
    # un cache agressif est sûr. Exemple (conteneur nginx avec volume) :
    #   location /_next/static/ { proxy_cache_valid 200 365d; add_header Cache-Control "public, max-age=31536000, immutable"; }

    # ---- API REST -------------------------------------------------
    location /api/ {
        proxy_pass http://yahriacad_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- WebSocket temps réel (/ws/v1/progress) -------------------
    location /ws/ {
        proxy_pass http://yahriacad_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sessions de routage longues : pas de coupure avant 1 h.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_buffering       off;
    }

    # ---- Application Next.js (SSR + assets) ------------------------
    location / {
        proxy_pass http://yahriacad_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
