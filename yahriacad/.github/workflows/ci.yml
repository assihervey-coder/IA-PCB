# ==============================================================
# YahriaCad — Intégration continue
#
# Trois jobs indépendants (échouent vite, se lancent en parallèle) :
#   1. backend    : format + vet + build + tests Go (module racine)
#   2. ai-engine  : lint ruff + pytest Python + régénération des
#                   stubs gRPC (détection de dérive du contrat)
#   3. frontend   : build Next.js (TypeScript strict)
#
# Les tags v* déclenchent aussi la CI (garde-fou avant release).
# ==============================================================

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------
  # 1. Backend Go — build + tests
  # ------------------------------------------------------------
  backend:
    name: Backend Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: go.sum

      - name: Vérifier le format (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l backend shared)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Fichiers non formatés (gofmt) :"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath ./...

      - name: Tests (race detector)
        run: go test -race -count=1 ./...

  # ------------------------------------------------------------
  # 2. Moteur IA Python — lint + tests + contrat gRPC
  # ------------------------------------------------------------
  ai-engine:
    name: AI Engine Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check ai-engine

      - name: Tests (pytest)
        run: pytest -q

      - name: Vérifier la dérive des stubs gRPC (Python)
        run: |
          python -m grpc_tools.protoc -I shared/types \
            --python_out=shared/gen/python \
            --grpc_python_out=shared/gen/python \
            shared/types/pcb.proto
          if ! git diff --exit-code -- shared/gen/python; then
            echo "::error::Les stubs Python ne correspondent plus à pcb.proto (régénérez avec make proto)."
            exit 1
          fi

  # ------------------------------------------------------------
  # 3. Frontend — build Next.js
  # ------------------------------------------------------------
  frontend:
    name: Frontend Next.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true # next lint est informatif tant que la config ESLint n'est pas figée
